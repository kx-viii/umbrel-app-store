version: "3.7"

services:
  app_proxy:
    environment:
      # qBittorrent shares gluetun's network, so the web UI is reached through the gluetun container
      APP_HOST: home-qbittorrent-vpn_gluetun_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"
      PROXY_AUTH_WHITELIST: "/api/*"

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    # The key can only be added in Umbrel after install, so without it gluetun stays up
    # (letting the install succeed) but blocks all outgoing traffic instead of exiting
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${WIREGUARD_PRIVATE_KEY}" ]; then
          echo "WIREGUARD_PRIVATE_KEY is not set: add it in Umbrel > app Settings > Advanced > Custom variables (service: gluetun). All outgoing traffic is blocked until then."
          iptables -P OUTPUT DROP || exit 1
          iptables -P FORWARD DROP || exit 1
          iptables -A OUTPUT -o lo -j ACCEPT || exit 1
          ip6tables -P OUTPUT DROP 2>/dev/null
          ip6tables -P FORWARD DROP 2>/dev/null
          ip6tables -A OUTPUT -o lo -j ACCEPT 2>/dev/null
          while true; do sleep 3600; done
        fi
        exec /gluetun-entrypoint
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # WIREGUARD_PRIVATE_KEY is set in the Umbrel app settings (Advanced > Custom variables), never here
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      # HTTP proxy on 8888 so other apps (Prowlarr, FlareSolverr) can send their traffic through the VPN
      - HTTPPROXY=on
      # Let the Umbrel proxy, Radarr/Sonarr and proxy users reach the web UI (8080) and HTTP proxy (8888)
      - FIREWALL_INPUT_PORTS=8080,8888
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
    restart: on-failure

  server:
    image: ghcr.io/hotio/qbittorrent:release-5.2.3@sha256:251f7c1561294a9efb5aaafff50adf82952a2975f35dbb2bb519790d5068bcfb
    # All qBittorrent traffic goes through gluetun, whose firewall only lets VPN traffic out
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
