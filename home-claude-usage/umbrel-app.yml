id: home-claude-usage
category: developer
name: Claude Usage
version: "1.0.0"
tagline: Dashboards for your Claude Code sessions, tokens and cost
icon: https://raw.githubusercontent.com/kx-viii/umbrel-app-store/main/home-claude-usage/icon.svg
description: >-
  Collects the usage telemetry that Claude Code can send with OpenTelemetry and shows it on a ready-made Grafana
  dashboard: what each day would have cost at API prices, tokens by type, requests per model, prompts, sessions,
  active time, the tools Claude used and any API errors. Everything stays on this Umbrel.


  Claude Code never sends the text of your prompts, Claude's replies or tool commands unless you turn that on
  yourself, so by default the data is counts, timings and model names.


  🛠️ SET-UP INSTRUCTIONS


  On each computer that runs Claude Code, add this to the "env" section of ~/.claude/settings.json, then start a
  new Claude Code session:


  "CLAUDE_CODE_ENABLE_TELEMETRY": "1",
  "OTEL_METRICS_EXPORTER": "otlp",
  "OTEL_LOGS_EXPORTER": "otlp",
  "OTEL_EXPORTER_OTLP_PROTOCOL": "http/protobuf",
  "OTEL_EXPORTER_OTLP_ENDPOINT": "http://<this Umbrel's address>:4318",
  "OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE": "cumulative"


  The collector on port 4318 has no password, so only use it on your home network or Tailscale.
