version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-claude-usage_lgtm_1
      APP_PORT: 3000
      # Keeps the Umbrel login in front of Grafana, which lets anyone past it in as admin

  lgtm:
    # Grafana, Prometheus, Loki and an OpenTelemetry collector in one image
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    environment:
      # Keep a year of metrics; Loki keeps events until deleted
      - PROMETHEUS_EXTRA_ARGS=--storage.tsdb.retention.time=400d
      - LOKI_EXTRA_ARGS=-store.max-query-length=0
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/claude-dashboards/claude-code.json
      # No calls home from Grafana
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/claude.yaml:ro
      - ${APP_DATA_DIR}/grafana/claude-code.json:/otel-lgtm/claude-dashboards/claude-code.json:ro
    ports:
      # OTLP over HTTP, where Claude Code sends its telemetry
      - "4318:4318"
    restart: on-failure
