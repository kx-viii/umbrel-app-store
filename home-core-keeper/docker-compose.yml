version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-core-keeper_web_1
      APP_PORT: 8080
      # Keeps the Umbrel login in front of the page, since the Game ID is what lets people join

  server:
    image: escaping/core-keeper-dedicated:latest@sha256:87fa7925596264e1460cb6c7c128e9d39ac5445206e04e587993b5d4afa7c90f
    # Players join with the Game ID over Steam's relay (no SERVER_PORT), so no ports are published
    environment:
      - WORLD_NAME=Home
      - MAX_PLAYERS=4
    volumes:
      # Server files from SteamCMD (refreshed every start); GameID.txt is written here
      - ${APP_DATA_DIR}/data/server:/home/steam/core-keeper-dedicated
      # Worlds and ServerConfig.json, which keeps the same Game ID across restarts
      - ${APP_DATA_DIR}/data/save:/home/steam/core-keeper-data
    # Gives the server time to save the world on stop
    stop_grace_period: 2m
    restart: on-failure

  web:
    image: busybox:1.37.0
    # A one-page status site that shows the current Game ID
    command:
      - sh
      - -c
      - |
        mkdir -p /www/cgi-bin
        cat > /www/cgi-bin/index.cgi <<'EOF'
        #!/bin/sh
        ID=$$(cat /server/GameID.txt 2>/dev/null | tr -cd 'A-Za-z0-9')
        echo "Content-Type: text/html; charset=utf-8"
        echo ""
        if [ -n "$$ID" ]; then
          BODY="<p class=label>Game ID</p><p class=id id=gid>$$ID</p><button onclick=\"navigator.clipboard.writeText(document.getElementById('gid').textContent);this.textContent='Copied'\">Copy</button><ol><li>Open Core Keeper and choose <b>Play</b>.</li><li>Pick <b>Join game</b>, then enter the Game ID.</li><li>Pick your character and join.</li></ol><p class=note>Only share this ID with people you want in your world.</p>"
          REFRESH=""
        else
          BODY="<p class=label>Starting</p><p>The server is starting. The first start downloads it from Steam and can take several minutes. This page refreshes by itself.</p>"
          REFRESH="<meta http-equiv=refresh content=15>"
        fi
        cat <<HTML
        <!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">$$REFRESH<title>Core Keeper</title>
        <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131c;color:#e8ecf4;font:16px/1.5 system-ui,sans-serif}main{max-width:26rem;padding:2rem 1rem}h1{margin:0 0 1.5rem;font-size:1.4rem}.label{margin:0;color:#8a93a8;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}.id{margin:.25rem 0 1rem;font:600 1.6rem ui-monospace,monospace;word-break:break-all;user-select:all}button{padding:.5rem 1.2rem;border:0;border-radius:.5rem;background:#3b82f6;color:#fff;font:inherit;cursor:pointer}ol{padding-left:1.2rem}.note{color:#8a93a8;font-size:.9rem}</style>
        </head><body><main><h1>Core Keeper server</h1>$$BODY</main></body></html>
        HTML
        EOF
        chmod +x /www/cgi-bin/index.cgi
        exec httpd -f -p 8080 -h /www
    volumes:
      - ${APP_DATA_DIR}/data/server:/server:ro
    restart: on-failure
