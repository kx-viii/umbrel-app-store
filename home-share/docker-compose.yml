version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-share_web_1
      APP_PORT: 8080
      # Keeps the Umbrel login in front of the page for making links

  web:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "1000:1000"
    # No packages to install: the server only uses Node's built-in modules
    command: ["node", "/src/server.mjs"]
    environment:
      - DATA_DIR=/data
    volumes:
      - ${APP_DATA_DIR}/server:/src:ro
      - ${APP_DATA_DIR}/data:/data
    ports:
      # Watch pages and their streams only, reachable from the Umbrel itself so Tailscale Funnel can put them online
      - "127.0.0.1:8486:8081"
    restart: on-failure
