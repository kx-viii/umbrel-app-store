version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-discord-assistant_web_1
      APP_PORT: 8080
      # Keeps the Umbrel login in front of the status page

  bot:
    image: node:24.22.1-alpine@sha256:6a1c190e17215d844926b0677f4bf87273ff7d5e54db06d3b5b5863ab0b09a3d
    user: "1000:1000"
    # The keys are custom variables on this service (ANTHROPIC_API_KEY, DISCORD_BOT_TOKEN), never in this repo
    environment:
      - STATUS_FILE=/status/index.html
    working_dir: /app
    # Copies the bot from the app folder and installs its pinned packages, then runs it
    command:
      - sh
      - -c
      - cp /src/bot.mjs /src/package.json /src/package-lock.json /app/ && npm ci --omit=dev --no-audit --no-fund && exec node bot.mjs
    volumes:
      - ${APP_DATA_DIR}/bot:/src:ro
      - ${APP_DATA_DIR}/data/app:/app
      - ${APP_DATA_DIR}/data/status:/status
    restart: on-failure

  web:
    image: busybox:1.37.0
    # Serves the status page the bot writes
    command: ["httpd", "-f", "-p", "8080", "-h", "/status"]
    volumes:
      - ${APP_DATA_DIR}/data/status:/status:ro
    restart: on-failure
