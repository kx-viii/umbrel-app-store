version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-f1-telemetry_relay_1
      APP_PORT: 8080
      # Only reachable on the LAN and Tailscale; no Umbrel login so the Home Screen icon opens straight in
      PROXY_AUTH_ADD: "false"

  relay:
    # Built by GitHub Actions in kx-viii/f1-telemetry; the tag is the source commit
    image: ghcr.io/kx-viii/f1-telemetry:sha-a267917
    # Serves the dashboard, the WebSocket (/ws) and /health on one port; history is in memory only
    restart: on-failure
