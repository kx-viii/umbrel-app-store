version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: home-cleanuparr_web_1
      APP_PORT: 11011
      # Cleanuparr has its own login, so skip the Umbrel one to avoid signing in twice
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.10@sha256:fd532c99716dbaba1cda12208f3a8e3651b8125c50fcd59dfe35a91c9506e665
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - ${APP_DATA_DIR}/data:/config
    ports:
      # Direct access (and the API) behind Cleanuparr's own login
      - "11011:11011"
    restart: on-failure
